# Reduced instance for exhaustive verification (4 robots on C1-C2 and K1-K2).
# A 3 x 2 block of lanes with one connector: an outer loop of 6 cells and an inner loop
# of 4 cells (2,2) -> (2,1) -> (3,1) -> (3,2), which 4 robots can fill into a deadlock.
#
# Tokens: see layouts/warehouse_15x8.yaml.

name: mini
cell_size: 1.0  # metres

grid: |
  .   P1  #   P2
  K2  v   +<v <
  K1  >   +>  ^
  .   C1  C2  D1
